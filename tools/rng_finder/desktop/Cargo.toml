[package]
name = "rng-finder-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "x11", "wayland", "tokio", "advanced"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
